act.livestart=()=>{if(sim)toggleSim();else toggleGps();render()};

      geoidNoModel: 'لم يتم تحميل نموذج. استورد EGM2008Libya.GEM.',
      geoidLoaded: 'النموذج محفوظ محليًا',
      geoidBounds: 'النطاق',
      geoidStep: 'تباعد الشبكة',
      geoidHeight: 'الارتفاع الإهليلجي GPS h',
      geoidSep: 'فصل الجيويد N',
      geoidOrtho: 'الارتفاع الأرثومتري H',
      geoidOutside: 'الموقع خارج نطاق النموذج؛ لم يتغير Z.',
      geoidNoAlt: 'ارتفاع GPS غير متاح.',
      geoidFormat: 'تنسيق GEM غير معروف. يقبل هذا القارئ ملف EGM2008Libya المرفق.',
      geoidImported: 'تم تحميل EGM2008 وتحويل Z ضمن النطاق مع الاحتفاظ بـ h الأصلي.',
      geoidOn: 'تم تفعيل تصحيح الجيويد.',
      geoidOff: 'تم إيقاف التصحيح واستعادة ارتفاعات المصدر h.',
      geoidExport: 'تصدير CSV h / N / H',
      geoidFormula: 'h هو الارتفاع الإهليلجي؛ N هو فصل الجيويد المستوفى؛ H = h − N. يتم الاحتفاظ بكلا الارتفاعين.',
      geoidCoords: 'إحداثيات WGS 84 الجغرافية',
      geoidBilinear: 'استيفاء ثنائي خطي',
      geoidCoverage: 'خارج النطاق',
      geoidFileError: 'تعذرت قراءة نموذج GEM.',
      geoidSaved: 'محفوظ على هذا الجهاز',
      geoidDataHeader: 'type;name;latitude_deg;longitude_deg;h_ellipsoidal_m;N_EGM2008_m;H_orthometric_m'
    }
  };
  Object.keys(geoidText).forEach(lang => Object.assign(T[lang], geoidText[lang]));
  const gt = key => (T[S.lg] && T[S.lg][key]) || T.fr[key] || key;
  const closeTo = (a, b, tol) => Math.abs(a - b) <= tol;

  function parseSuppliedGem(buffer) {
    const bytes = new Uint8Array(buffer);
    const view = new DataView(buffer);
    if (bytes.length < 200 || bytes[0] !== 0x09 || bytes[1] !== 0x00 || bytes[2] !== 0x66 || bytes[3] !== 0x00) throw new Error('format');
    const datum = String.fromCharCode(...bytes.subarray(57, 65));
    if (datum !== 'WGS 1984') throw new Error('format');
    const ellipsoidA = view.getFloat64(88, true);
    const flattening = view.getFloat64(96, true);
    const lat0 = view.getFloat64(104, true), lon0 = view.getFloat64(112, true);
    const lat1 = view.getFloat64(120, true), lon1 = view.getFloat64(128, true);
    const dLat = view.getFloat64(136, true), dLon = view.getFloat64(144, true);
    const verticalOffset = view.getFloat32(153, true);
    if (!closeTo(ellipsoidA, 6378137, 0.01) || !closeTo(flattening, 1 / 298.257223563, 1e-9)) throw new Error('format');
    if (!(lat0 < lat1 && lon0 < lon1 && dLat > 0 && dLon > 0 && Number.isFinite(verticalOffset) && Math.abs(verticalOffset) < 200)) throw new Error('format');
    const rows = Math.round((lat1 - lat0) / dLat) + 1;
    const cols = Math.round((lon1 - lon0) / dLon) + 1;
    if (rows < 2 || cols < 2 || rows > 2000 || cols > 2000 || !closeTo((rows - 1) * dLat, lat1 - lat0, 2e-5) || !closeTo((cols - 1) * dLon, lon1 - lon0, 2e-5)) throw new Error('format');
    const count = rows * cols;
    if (GEOID_DATA_OFFSET + count * 2 + GEOID_TRAILER_BYTES !== bytes.length) throw new Error('format');
    // This supplied Leica GEM variant stores a packed little-endian signed-int16 grid at byte 165.
    // Each sample is in millimetres relative to the float32 vertical offset at byte 153.
    const values = new Int16Array(count);
    for (let i = 0; i < count; i++) values[i] = view.getInt16(GEOID_DATA_OFFSET + i * 2, true);
    return { datum, ellipsoidA, flattening, lat0, lon0, lat1, lon1, dLat, dLon, rows, cols, values, scale: GEOID_SCALE, verticalOffset, name: 'EGM2008Libya.GEM' };
  }

  function interpolateGeoid(lat, lon) {
    const m = geoidModel;
    if (!m || !Number.isFinite(+lat) || !Number.isFinite(+lon)) return null;
    const la = +lat * Math.PI / 180, lo = +lon * Math.PI / 180;
    const y = (la - m.lat0) / m.dLat;
    const x = (lo - m.lon0) / m.dLon;
    const eps = 1e-8;
    if (x < -eps || y < -eps || x > m.cols - 1 + eps || y > m.rows - 1 + eps) return null;
    const x0 = Math.min(m.cols - 2, Math.max(0, Math.floor(x)));
    const y0 = Math.min(m.rows - 2, Math.max(0, Math.floor(y)));
    const fx = Math.max(0, Math.min(1, x - x0));
    const fy = Math.max(0, Math.min(1, y - y0));
    const at = (ix, iy) => m.verticalOffset + m.values[iy * m.cols + ix] * m.scale;
    const a = at(x0, y0), b = at(x0 + 1, y0), c = at(x0, y0 + 1), d = at(x0 + 1, y0 + 1);
    return (a * (1 - fx) + b * fx) * (1 - fy) + (c * (1 - fx) + d * fx) * fy;
  }

  function correctPoint(p) {
    if (!geoidModel || !p || p.alt == null || !Number.isFinite(+p.alt)) return false;
    if (p.h == null || !Number.isFinite(+p.h)) p.h = +p.alt;
    const n = interpolateGeoid(p.lat, p.lon);
    if (n == null) {
      p.N = null; p.H = null; p.alt = +p.h;
      return false;
    }
    p.N = n;
    p.H = +p.h - n;
    p.alt = geoidEnabled ? p.H : +p.h;
    return true;
  }
  function copyVertical(src, dest) {
    if (!src || !dest) return;
    if (src.h != null) dest.h = +src.h;
    if (src.N != null) dest.N = +src.N;
    if (src.H != null) dest.H = +src.H;
    if (geoidEnabled && dest.h != null) dest.alt = dest.H;
  }
  function allProjectPoints() {
    const out = [];
    if (Array.isArray(wpts)) out.push(...wpts);
    if (Array.isArray(track)) out.push(...track);
    if (Array.isArray(routes)) routes.forEach(r => { if (r && Array.isArray(r.pts)) out.push(...r.pts); });
    if (Array.isArray(polys)) polys.forEach(g => { if (g && Array.isArray(g.pts)) out.push(...g.pts); });
    if (Array.isArray(meas)) out.push(...meas);
    return out;
  }
  function applyToProject() {
    if (!geoidModel) return;
    allProjectPoints().forEach(p => {
      if (p && p.alt != null && Number.isFinite(+p.alt)) correctPoint(p);
    });
    if (gps && gps.alt != null && Number.isFinite(+gps.alt)) correctPoint(gps);
  }
  function persistGeoidProject() {
    try { sv(); if (typeof saveRec === 'function') saveRec(); } catch (e) {}
  }
  function refreshGeoid() {
    persistGeoidProject();
    try { draw(); render(); } catch (e) {}
  }
  function base64FromBytes(bytes) {
    let binary = '';
    for (let i = 0; i < bytes.length; i += 0x8000) binary += String.fromCharCode(...bytes.subarray(i, i + 0x8000));
    return btoa(binary);
  }
  function bytesFromBase64(text) {
    const binary = atob(text), bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
    return bytes;
  }
  function setEnabled(enabled, notify = true) {
    if (!geoidModel) { geoidEnabled = false; return; }
    geoidEnabled = !!enabled;
    try { localStorage.setItem(GEOID_ENABLED_KEY, geoidEnabled ? '1' : '0'); } catch (e) {}
    applyToProject();
    refreshGeoid();
    if (notify) toast(gt(geoidEnabled ? 'geoidOn' : 'geoidOff'));
  }

  try {
    const saved = localStorage.getItem(GEOID_KEY);
    if (saved) {
      const record = JSON.parse(saved);
      geoidModel = parseSuppliedGem(bytesFromBase64(record.data).buffer);
      geoidModel.fileName = record.fileName || geoidModel.name;
      geoidEnabled = localStorage.getItem(GEOID_ENABLED_KEY) !== '0';
    } else if (GEOID_EMBEDDED_B64.length > 100) {
      const bytes = bytesFromBase64(GEOID_EMBEDDED_B64);
      geoidModel = parseSuppliedGem(bytes.buffer);
      geoidModel.fileName = 'EGM2008Libya.GEM';
      geoidEnabled = true;
      localStorage.setItem(GEOID_KEY, JSON.stringify({ fileName: geoidModel.fileName, data: GEOID_EMBEDDED_B64 }));
      localStorage.setItem(GEOID_ENABLED_KEY, '1');
    }
  } catch (e) { geoidModel = null; geoidEnabled = false; }

  const fileInput = document.createElement('input');
  fileInput.type = 'file'; fileInput.accept = '.gem,.GEM'; fileInput.style.display = 'none';
  fileInput.addEventListener('change', async event => {
    const file = event.target.files && event.target.files[0]; event.target.value = '';
    if (!file) return;
    try {
      const buffer = await file.arrayBuffer();
      const model = parseSuppliedGem(buffer);
      geoidModel = model; geoidModel.fileName = file.name;
      geoidEnabled = true;
      localStorage.setItem(GEOID_KEY, JSON.stringify({ fileName: file.name, data: base64FromBytes(new Uint8Array(buffer)) }));
      localStorage.setItem(GEOID_ENABLED_KEY, '1');
      applyToProject(); refreshGeoid(); toast(gt('geoidImported'));
    } catch (e) {
      toast(e && e.message === 'format' ? gt('geoidFormat') : gt('geoidFileError'));
    }
  });
  document.body.appendChild(fileInput);

  function geoidSection() {
    const head = geoidModel
      ? `<p><b>${gt('geoidLoaded')}</b> · ${String(geoidModel.fileName || geoidModel.name).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}<br>${gt('geoidBounds')}: ${(+geoidModel.lon0 * 180 / Math.PI).toFixed(3)}°–${(+geoidModel.lon1 * 180 / Math.PI).toFixed(3)}° E, ${(+geoidModel.lat0 * 180 / Math.PI).toFixed(3)}°–${(+geoidModel.lat1 * 180 / Math.PI).toFixed(3)}° N<br>${gt('geoidStep')}: ${(geoidModel.dLat * 180 / Math.PI * 60).toFixed(3)}′ · ${geoidModel.rows} × ${geoidModel.cols} · ${gt('geoidBilinear')}</p>`
      : `<p>${gt('geoidNoModel')}</p>`;
    let live = '';
    if (geoidModel && gps) {
      const n = interpolateGeoid(gps.lat, gps.lon);
      const h = gps.h != null ? +gps.h : (gps.alt == null ? null : +gps.alt);
      if (h == null) live = `<p>${gt('geoidNoAlt')}</p>`;
      else if (n == null) live = `<p>${gt('geoidOutside')}</p>`;
      else live = `<div class="live-gps-grid"><div><small>${gt('geoidHeight')}</small><div class="live-gps-value">${h.toFixed(3)} m</div></div><div><small>${gt('geoidSep')}</small><div class="live-gps-value">${n.toFixed(3)} m</div></div><div style="grid-column:1/-1"><small>${gt('geoidOrtho')}</small><div class="live-gps-value">${(h - n).toFixed(3)} m</div></div></div>`;
    }
    return `<section class="live-gps geoid-box"><h4>${gt('geoidTitle')}</h4>${head}<p>${gt('geoidFormula')}</p><p><button class="b" data-a="geoidImport">${gt('geoidImport')}</button>${geoidModel ? ` <button class="b${geoidEnabled ? ' p' : ''}" data-a="geoidToggle">${geoidEnabled ? gt('geoidDisable') : gt('geoidEnable')}</button>` : ''}</p>${live}${geoidModel ? `<p><button class="b" data-a="geoidCsv">${gt('geoidExport')}</button></p>` : ''}<small>${gt('geoidSaved')} · ${gt('geoidCoords')}</small></section>`;
  }
  const previousGeoidTools = V_.tools;
  V_.tools = () => previousGeoidTools() + geoidSection();

  act.geoidImport = () => fileInput.click();
  act.geoidToggle = () => setEnabled(!geoidEnabled);
  act.geoidCsv = () => {
    if (!geoidModel) return;
    const entries = [];
    wpts.forEach(p => entries.push(['point', p.n || '', p]));
    track.forEach(p => entries.push(['trace', p.s || '', p]));
    meas.forEach(p => entries.push(['mesure', p.n || '', p]));
    routes.forEach(r => (r.pts || []).forEach(p => entries.push(['route', r.n || '', p])));
    polys.forEach(g => (g.pts || []).forEach(p => entries.push(['polygone', g.n || '', p])));
    const quote = v => `"${String(v == null ? '' : v).replace(/"/g, '""')}"`;
    const rows = [gt('geoidDataHeader')];
    entries.forEach(([type, name, p]) => {
      const n = interpolateGeoid(p.lat, p.lon);
      const h = p.h != null ? +p.h : (p.alt == null ? null : (geoidEnabled && n != null ? +p.alt + n : +p.alt));
      const H = n != null && h != null ? h - n : null;
      rows.push([type, name, (+p.lat).toFixed(8), (+p.lon).toFixed(8), h == null ? '' : h.toFixed(3), n == null ? '' : n.toFixed(3), H == null ? '' : H.toFixed(3)].map(quote).join(';'));
    });
    dl('SubTopo-Geo_EGM2008_h_N_H.csv', '\uFEFF' + rows.join('\r\n'), 'text/csv;charset=utf-8');
  };

  // Convert new GPS fixes before the application stores them; retain raw h, N and H.
  if (typeof fix === 'function') {
    const originalFix = fix;
    fix = function (p) {
      if (geoidModel && geoidEnabled && p && p.alt != null) correctPoint(p);
      const before = Array.isArray(track) ? track.length : 0;
      const result = originalFix(p);
      if (geoidModel && geoidEnabled && track.length > before) {
        const q = track[track.length - 1]; copyVertical(p, q); persistGeoidProject();
      }
      return result;
    };
  }
  if (typeof simStep === 'function') {
    const originalSimStep = simStep;
    simStep = function () {
      if (gps && gps.h != null) gps.alt = +gps.h;
      return originalSimStep();
    };
  }
  if (typeof addWp === 'function') {
    const originalAddWp = addWp;
    addWp = function (p) {
      if (geoidModel && geoidEnabled && p && p.alt != null) correctPoint(p);
      return originalAddWp(p);
    };
  }
  if (typeof merge === 'function') {
    const originalMerge = merge;
    merge = function (data) {
      const result = originalMerge(data);
      if (geoidModel && geoidEnabled) { applyToProject(); persistGeoidProject(); }
      return result;
    };
  }

  function attachLastGpsPoint(list) {
    if (!geoidModel || !geoidEnabled || !gps || !list || !list.length) return;
    const p = list[list.length - 1];
    if (Math.abs(+p.lat - +gps.lat) < 1e-10 && Math.abs(+p.lon - +gps.lon) < 1e-10) {
      copyVertical(gps, p);
      if (p.h == null && p.alt != null) correctPoint(p);
    }
  }
  ['addg'].forEach(key => {
    if (typeof act[key] === 'function') {
      const original = act[key];
      act[key] = function (...args) { const n = wpts.length; const r = original.apply(this, args); if (wpts.length > n) attachLastGpsPoint(wpts); persistGeoidProject(); return r; };
    }
  });
  if (typeof act.measuregps === 'function') {
    const original = act.measuregps;
    act.measuregps = function (...args) { const n = meas.length; const r = original.apply(this, args); if (meas.length > n) attachLastGpsPoint(meas); return r; };
  }
  if (typeof act.savepoints === 'function') {
    const original = act.savepoints;
    act.savepoints = function (...args) {
      const start = wpts.length, snapshot = meas.slice();
      const r = original.apply(this, args);
      if (geoidModel && geoidEnabled) snapshot.forEach((p, i) => { if (wpts[start + i]) copyVertical(p, wpts[start + i]); });
      persistGeoidProject(); return r;
    };
  }
  ['toggleRec', 'pauseRec'].forEach(key => {
    if (typeof window[key] === 'function') {
      const original = window[key];
      window[key] = function (...args) { const before = track.length; const r = original.apply(this, args); if (track.length > before) { const p = track[track.length - 1]; if (gps) copyVertical(gps, p); persistGeoidProject(); } return r; };
    }
  });

  // Apply the saved model to the project loaded at startup, and whenever a project is rendered.
  if (geoidModel) {
    if (geoidEnabled) applyToProject();
    persistGeoidProject();
  }
  const originalRender = render;
  render = function (...args) {
    if (geoidModel && geoidEnabled) {
      let changed = false;
      allProjectPoints().forEach(p => {
        if (p && p.alt != null && p.h == null) { correctPoint(p); changed = true; }
      });
      if (changed) persistGeoidProject();
    }
    return originalRender.apply(this, args);
  };
})();

</script>
<script>
(() => {
  let proDemoOfflineExpanded = false;
  const proDemoStyle = document.createElement('style');
  proDemoStyle.textContent = `
    .pro-demo-wrap{margin:18px 0 12px;padding:14px;border:1px solid #d3ddd5;border-radius:15px;background:linear-gradient(145deg,#fbfdf9,#f0f6ee);color:#1d2b27}

    @media(max-width:440px){.pro-demo-wrap{padding:11px;margin:14px 0 8px}.pro-demo-card{padding:9px}.pro-demo-value{font-size:13px}}
  `;
  document.head.appendChild(proDemoStyle);

  function proDemoProfile() {
    const actual = Array.isArray(track) ? track.map(p => +p.alt).filter(Number.isFinite) : [];
    const samples = actual.length >= 2 ? actual.slice(-24) : [247, 253, 251, 266, 272, 269, 284, 291, 287, 305, 298, 316];
    const min = Math.min(...samples), max = Math.max(...samples), span = Math.max(1, max - min);
    const points = samples.map((v, i) => `${(10 + i * (300 / Math.max(1, samples.length - 1))).toFixed(1)},${(64 - (v - min) / span * 48).toFixed(1)}`).join(' ');
    const source = actual.length >= 2 ? `Trace actuelle · ${track.length} positions` : 'Profil d’exemple · valeurs simulées';
    return `<div class="pro-demo-card wide"><div class="pro-demo-label"><span>Profil altimétrique</span><span>${actual.length >= 2 ? 'TRACE' : 'APERÇU'}</span></div><svg class="pro-demo-chart" viewBox="0 0 320 76" role="img" aria-label="Profil d’altitude illustratif"><path d="M10 67H310M10 42H310M10 17H310" stroke="#e4ebe4" stroke-width="1"/><polyline points="${points}" fill="none" stroke="#3c8b69" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/><text x="10" y="74" fill="#75847a" font-size="7">DÉPART</text><text x="277" y="74" fill="#75847a" font-size="7">PARCOURS</text></svg><div class="pro-demo-sub">${source} · altitude ${min.toFixed(0)}–${max.toFixed(0)} m</div><div class="pro-demo-sub">Suggestion : afficher le dénivelé après filtrage du bruit GNSS.</div></div>`;
  }

  function proDemoTools() {
    const hasGps = !!gps;
    const accuracy = hasGps && Number.isFinite(+gps.acc) ? `±${(+gps.acc).toFixed(0)} m` : 'En attente';

    return `<section class="pro-demo-wrap"><div class="pro-demo-head"><div><div class="pro-demo-kicker">Aperçu des améliorations</div><h3>Mode terrain professionnel</h3></div><span class="pro-demo-badge">DÉMO · SANS FAUSSE MESURE</span></div><div class="pro-demo-grid"><div class="pro-demo-card"><div class="pro-demo-label"><span>Qualité GPS</span><span class="pro-demo-status"><i class="pro-demo-dot" style="${hasGps ? '' : 'background:#e2a23d'}"></i>${hasGps ? 'ACTIF' : 'ATTENTE'}</span></div><div class="pro-demo-value">${accuracy}</div><div class="pro-demo-sub">${gpsDetail}</div></div><div class="pro-demo-card"><div class="pro-demo-label"><span>Carte hors ligne</span><span class="pro-demo-status" style="color:#9a6a18"><i class="pro-demo-dot" style="background:#e2a23d"></i>APERÇU</span></div><div class="pro-demo-value">Zone locale</div><div class="pro-demo-sub">Indicateur de couverture à connecter au cache cartographique réel.</div><div class="pro-demo-bar"><i></i></div><button class="b" data-pro-demo="offline" style="margin-top:8px;min-height:30px;font-size:10px">${proDemoOfflineExpanded ? 'Masquer le détail' : 'Détail de couverture'}</button>${proDemoOfflineExpanded ? '<div class="pro-demo-expanded">État simulé uniquement : cette démo ne vérifie pas les tuiles stockées. Dans la version finale, afficher ici la zone réellement disponible hors connexion et les niveaux de zoom.</div>' : ''}</div>${proDemoProfile()}<div class="pro-demo-card wide"><div class="pro-demo-label"><span>Sauvegarde du projet</span><span class="pro-demo-status"><i class="pro-demo-dot"></i>OUTIL EXISTANT</span></div><div class="pro-demo-sub">Export JSON des points, traces, parcelles et réglages de projet.</div><div class="pro-demo-actions"><button class="primary" data-pro-demo="backup">Exporter le projet JSON</button><button data-pro-demo="traces">Voir l’analyse de trace</button></div></div></div><div class="pro-demo-foot">Cette extension est une démonstration ajoutée à une copie de ton application. Les indicateurs de couverture et le profil d’exemple sont simulés; les outils cartographiques, mesures, coordonnées et géoïde de l’application originale sont conservés.</div></section>`;
  }

  const proDemoOriginalTools = V_.tools;
  V_.tools = () => proDemoOriginalTools() + proDemoTools();
  const proDemoOriginalTrack = V_.trk;
  V_.trk = () => proDemoOriginalTrack() + proDemoProfile();

  document.addEventListener('click', event => {
    const button = event.target.closest('[data-pro-demo]');
    if (!button) return;
    const action = button.dataset.proDemo;
    if (action === 'offline') {
      proDemoOfflineExpanded = !proDemoOfflineExpanded;
      render();
    } else if (action === 'backup') {
      if (act && typeof act.prjx === 'function') act.prjx();
    } else if (action === 'traces') {
      tab = 'trk';
      render();
    }
  });
})();

  const escText = value => String(value == null ? '' : value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const icon = name => ({

    compass:'<svg viewBox="0 0 24 24" fill="none"><circle cx="12" cy="12" r="9" stroke="currentColor" stroke-width="1.7"/><path d="m15.8 8.2-2.2 5.4-5.4 2.2 2.2-5.4 5.4-2.2Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/></svg>',
    ruler:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 17 17 4l3 3L7 20l-3-3Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="m13 8 3 3m-6 0 2 2m-5 0 3 3" stroke="currentColor" stroke-width="1.5"/></svg>',
    project:'<svg viewBox="0 0 24 24" fill="none"><path d="M4 6h6l2 2h8v11H4V6Z" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M4 10h16" stroke="currentColor" stroke-width="1.7"/></svg>',
    settings:'<svg viewBox="0 0 24 24" fill="none"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7Z" stroke="currentColor" stroke-width="1.7"/><path d="m19 13.5 2 .9-2 3.5-1.9-1a8 8 0 0 1-2.1 1.2l-.2 2.1h-4l-.3-2.1a8 8 0 0 1-2.1-1.2l-1.9 1-2-3.5 2-1a8 8 0 0 1 0-2.4l-2-1 2-3.5 1.9 1A8 8 0 0 1 10.5 6l.3-2.1h4L15 6a8 8 0 0 1 2.1 1.2l1.9-1 2 3.5-2 1a8 8 0 0 1 0 2.8Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>'
  })[name] || '';

  const style = document.createElement('style');
  style.textContent = `
    #aqMenuBtn{position:absolute;left:10px;top:418px;z-index:8;width:48px;height:48px;border:1px solid #d3d1c7;border-radius:12px;background:#fff;display:none;align-items:center;justify-content:center;color:#185fa5;box-shadow:0 2px 8px #172c2b16;cursor:pointer}
    #aqMenuBtn svg{width:21px;height:21px}#aqMenuBtn:active{transform:scale(.96)}
    #aqMenuScrim{position:absolute;inset:0;z-index:40;background:#0b1d1e66;display:none;opacity:0;transition:opacity .2s}
    #aqMenuDrawer{position:absolute;inset-block:0;inset-inline-start:0;z-index:41;width:min(82%,320px);max-width:320px;background:#fbfcfa;color:#1d2b27;box-shadow:0 8px 30px #102b2b35;transform:translateX(-104%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
    #aqMenuDrawer[dir=rtl]{transform:translateX(104%)}#aqMenuDrawer.open{transform:translateX(0)}#aqMenuScrim.open{display:block;opacity:1}
    .aqm-head{background:#0e2b2f;color:#fff;padding:20px 16px 15px;position:relative}
    .aqm-brand{display:flex;align-items:center;gap:11px}.aqm-mark{width:38px;height:38px;border-radius:11px;background:#ef9f27;display:grid;place-items:center;color:#0e2b2f;font-weight:900;font-size:18px}.aqm-brand strong{display:block;font-size:15px;letter-spacing:-.2px}.aqm-brand small{display:block;color:#c6d9d1;font-size:10px;margin-top:2px}
    .aqm-close{position:absolute;inset-inline-end:12px;top:12px;width:32px;height:32px;border:1px solid #ffffff3d;border-radius:9px;background:#ffffff14;color:#fff;font-size:20px;cursor:pointer}
    .aqm-location{margin-top:15px;padding:9px 10px;border:1px solid #ffffff24;border-radius:11px;background:#ffffff0c;display:flex;align-items:center;gap:8px;font-size:10px;color:#d6e4de}.aqm-location i{width:7px;height:7px;border-radius:50%;background:#e6a73a}.aqm-scroll{overflow:auto;padding:8px 10px 18px;flex:1;min-height:0}.aqm-group{margin:8px 0 3px;padding:8px 9px 5px;color:#71827b;font-size:9px;font-weight:800;letter-spacing:.1em}.aqm-item{width:100%;display:flex;align-items:center;gap:11px;border:0;border-radius:11px;background:transparent;padding:10px 9px;text-align:start;color:#213a35;cursor:pointer;font:500 12px system-ui}.aqm-item:hover,.aqm-item:focus-visible{background:#eaf2ec;outline:0}.aqm-item svg{width:18px;height:18px;color:#3a7162;flex:0 0 auto}.aqm-item .aqm-chev{margin-inline-start:auto;color:#99a8a1;font-size:18px}.aqm-divider{height:1px;background:#e4e9e4;margin:5px 7px}.aqm-foot{border-top:1px solid #e4e9e4;padding:10px 16px;color:#75847c;font-size:9px;line-height:1.4;background:#f5f8f4}
    @media(max-width:440px){#aqMenuBtn{left:10px;top:418px;width:48px;height:48px}.aqm-head{padding-top:calc(18px + env(safe-area-inset-top))}.aqm-scroll{padding-bottom:calc(16px + env(safe-area-inset-bottom))}}
    .aqm-item{padding-top:9px;padding-bottom:9px}
  `;
  document.head.appendChild(style);

  const phone = document.getElementById('phone');
  if (!phone || document.getElementById('aqMenuDrawer')) return;
  const menuButton = document.createElement('button');
  menuButton.id = 'aqMenuBtn';
  menuButton.type = 'button';
  menuButton.setAttribute('aria-label', tr('title'));
  menuButton.setAttribute('aria-expanded', 'false');
  menuButton.innerHTML = icon('menu');
  phone.appendChild(menuButton);

  const scrim = document.createElement('div');
  scrim.id = 'aqMenuScrim';
  scrim.setAttribute('aria-hidden', 'true');
  phone.appendChild(scrim);
  const drawer = document.createElement('aside');
  drawer.id = 'aqMenuDrawer';
  drawer.setAttribute('role', 'dialog');
  drawer.setAttribute('aria-modal', 'true');
  drawer.setAttribute('aria-label', tr('title'));
  phone.appendChild(drawer);

  function renderDrawer() {
    const lang = S.lg || 'fr';
    drawer.dir = lang === 'ar' ? 'rtl' : 'ltr';
    const project = escText(S.prj || 'SubTopo-Geo');
    const status = gps ? `${tr('active')} · ±${Number.isFinite(+gps.acc) ? (+gps.acc).toFixed(0) : '—'} m` : tr('waiting');
    drawer.innerHTML = `<div class="aqm-head"><button type="button" class="aqm-close" data-aq-close aria-label="${escText(tr('close'))}">×</button><div class="aqm-brand"><div class="aqm-mark">S</div><div><strong>SubTopo-Geo</strong><small>${escText(tr('subtitle'))}</small></div></div><div class="aqm-location"><i></i><span>${escText(status)}</span><span style="margin-inline-start:auto;opacity:.82">${project}</span></div></div><div class="aqm-scroll"><div class="aqm-group">${escText(tr('mapGroup'))}</div>${item('map','map','map')} ${item('layers','layers','layers','data-aq-action="layers"')}<div class="aqm-divider"></div><div class="aqm-group">${escText(tr('marksGroup'))}</div>${item('points','pin','pts')} ${item('tracks','track','trk')} ${item('areas','area','prop')}<div class="aqm-divider"></div><div class="aqm-group">${escText(tr('positionGroup'))}</div>${item('gps','gps','tools')}<div class="aqm-group">${escText(tr('toolsGroup'))}</div>${item('survey','ruler','tools')} ${item('coords','compass','set')}<div class="aqm-divider"></div><div class="aqm-group">${escText(tr('projectsGroup'))}</div>${item('projects','project','prj')} ${item('settings','settings','set')} </div><div class="aqm-foot"><b>Developed by: Fathi Nasraoui</b><br>SubTopo-Geo · navigation et levés de terrain<br>Interface originale, inspirée des usages des GPS outdoor.</div>`;
  }
  function item(labelKey, iconKey, route, extra = '') {
    return `<button type="button" class="aqm-item" data-aq-route="${route}" ${extra}>${icon(iconKey)}<span>${escText(tr(labelKey))}</span><span class="aqm-chev">›</span></button>`;
  }
  function openMenu() {
    renderDrawer();
    scrim.classList.add('open');
    drawer.classList.add('open');
    menuButton.setAttribute('aria-expanded', 'true');
  }
  function closeMenu() {
    scrim.classList.remove('open');
    drawer.classList.remove('open');
    menuButton.setAttribute('aria-expanded', 'false');
  }
  menuButton.addEventListener('click', openMenu);
  scrim.addEventListener('click', closeMenu);
  drawer.addEventListener('click', event => {
    const close = event.target.closest('[data-aq-close]');
    if (close) { closeMenu(); return; }
    const button = event.target.closest('[data-aq-route]');
    if (!button) return;
    const route = button.dataset.aqRoute;
    const action = button.dataset.aqAction;
    closeMenu();
    if (action === 'layers') { document.getElementById('bLay')?.click(); return; }
    if (action === 'center') { document.getElementById('bGo')?.click(); return; }
    if (action === 'compass') { document.getElementById('bCmp')?.click(); return; }
    tab = route;
    render();
    if (route === 'map' && typeof draw === 'function') draw();
  });
  document.addEventListener('keydown', event => { if (event.key === 'Escape') closeMenu(); });
  const startButton = document.getElementById('go');
  const splash = document.getElementById('spl');
  let aqMenuStarted = false;
  function syncMenuVisibility() {
    const visible = aqMenuStarted && tab === 'map';
    menuButton.style.display = visible ? 'flex' : 'none';
    if (!visible) closeMenu();
  }
  const originalRender = render;
  render = function() { originalRender.apply(this, arguments); syncMenuVisibility(); };
  const showMenu = () => { aqMenuStarted = true; syncMenuVisibility(); };
  if (!splash || getComputedStyle(splash).display === 'none') showMenu();
  if (startButton) startButton.addEventListener('click', () => setTimeout(showMenu, 50));
})();

</script>
<script>
(() => {
  const labels = {
    fr: {
      exportPointsTitle: 'Exporter uniquement les points enregistrés',
      exportTracksTitle: 'Exporter uniquement les traces et itinéraires',
      exportParcelsTitle: 'Exporter uniquement les parcelles',
      exportMeasuresTitle: 'Exporter la mesure en cours',
      exportHelp: 'CSV/DXF : système de coordonnées actif · KML/KMZ : coordonnées géographiques WGS84.',
      emptyPoints: 'Aucun point enregistré à exporter.',
      emptyTracks: 'Aucune trace ou aucun itinéraire à exporter.',
      emptyParcels: 'Aucune parcelle enregistrée à exporter.',
      emptyMeasures: 'Aucune mesure en cours à exporter.'
    },
    en: {
      exportPointsTitle: 'Export saved waypoints only',
      exportTracksTitle: 'Export tracks and routes only',
      exportParcelsTitle: 'Export parcels only',
      exportMeasuresTitle: 'Export current measurement',
      exportHelp: 'CSV/DXF: active coordinate system · KML/KMZ: WGS84 geographic coordinates.',
      emptyPoints: 'There are no saved waypoints to export.',
      emptyTracks: 'There are no tracks or routes to export.',
      emptyParcels: 'There are no saved parcels to export.',
      emptyMeasures: 'There is no current measurement to export.'
    },
    ar: {
      exportPointsTitle: 'تصدير النقاط المحفوظة فقط',
      exportTracksTitle: 'تصدير المسارات والطرق فقط',
      exportParcelsTitle: 'تصدير القطع فقط',
      exportMeasuresTitle: 'تصدير القياس الحالي',
      exportHelp: 'CSV/DXF: نظام الإحداثيات النشط · KML/KMZ: إحداثيات WGS84 الجغرافية.',
      emptyPoints: 'لا توجد نقاط محفوظة للتصدير.',
      emptyTracks: 'لا توجد مسارات أو طرق للتصدير.',
      emptyParcels: 'لا توجد قطع محفوظة للتصدير.',
      emptyMeasures: 'لا يوجد قياس حالي للتصدير.'
    }
  };
  Object.keys(labels).forEach(lang => Object.assign(T[lang], labels[lang]));
  const text = key => (T[S.lg] && T[S.lg][key]) || T.fr[key] || key;
  const escaped = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const titleKey = {points:'exportPointsTitle', tracks:'exportTracksTitle', parcels:'exportParcelsTitle', measures:'exportMeasuresTitle'};
  function exportPanel(scope) {
    return `<section class="dataset-export"><strong>${escaped(text(titleKey[scope]))}</strong><div class="dataset-export-help">${escaped(text('exportHelp'))}</div><div class="dataset-export-buttons">${['csv','dxf','kml','kmz'].map(fmt => `<button type="button" class="b" data-dataset-export="${scope}" data-export-format="${fmt}">${fmt.toUpperCase()}</button>`).join('')}</div></section>`;
  }
  const style = document.createElement('style');
  style.textContent = `.dataset-export{margin:10px 0;padding:10px;border:1px solid #d7e2d8;border-radius:12px;background:#f5f8f3;color:#213a35}.dataset-export>strong{display:block;font-size:12px;margin-bottom:4px}.dataset-export-help{font-size:10px;line-height:1.35;color:#61746a;margin-bottom:7px}.dataset-export-buttons{display:flex;flex-wrap:wrap;gap:6px}.dataset-export-buttons .b{min-width:54px;min-height:34px;padding:5px 9px;font-size:11px}`;
  document.head.appendChild(style);

  const addAfterHeading = (html, scope) => {
    const end = html.indexOf('</h3>');
    const panel = exportPanel(scope);
    return end >= 0 ? html.slice(0, end + 5) + panel + html.slice(end + 5) : panel + html;
  };
  ['pts','trk','prop'].forEach((key, i) => {
    const old = V_[key];
    if (typeof old !== 'function') return;
    const scope = ['points','tracks','parcels'][i];
    V_[key] = () => addAfterHeading(old(), scope);
  });
  if (typeof V_.tools === 'function') {
    const oldTools = V_.tools;
    V_.tools = () => addAfterHeading(oldTools(), 'measures');
  }

  function exportScoped(scope, format) {
    const all = {wpts, track, polys, routes, meas, prj:S.prj};
    const selected = {
      points: all.wpts.length,
      tracks: all.track.length + all.routes.reduce((n, r) => n + (r.pts ? r.pts.length : 0), 0),
      parcels: all.polys.length,
      measures: all.meas.length
    };
    if (!selected[scope]) {
      toast(text(scope === 'points' ? 'emptyPoints' : scope === 'tracks' ? 'emptyTracks' : scope === 'parcels' ? 'emptyParcels' : 'emptyMeasures'));
      return;
    }
    try {
      wpts = scope === 'points' ? all.wpts : [];
      track = scope === 'tracks' ? all.track : [];
      routes = scope === 'tracks' ? all.routes : [];
      polys = scope === 'parcels' ? all.polys : [];
      meas = scope === 'measures' ? all.meas : [];
      const suffix = {points:'points',tracks:'traces',parcels:'parcelles',measures:'mesures'}[scope];
      S.prj = `${all.prj || 'SubTopo-Geo'}_${suffix}`;
      exportAs(format);
    } catch (error) {
      toast(`Export ${format.toUpperCase()} impossible`);
      console.error('Export ciblé impossible:', error);
    } finally {
      wpts = all.wpts;
      track = all.track;
      polys = all.polys;
      routes = all.routes;
      meas = all.meas;
      S.prj = all.prj;
    }
  }
  document.addEventListener('click', event => {
    const button = event.target.closest('[data-dataset-export][data-export-format]');
    if (!button) return;
    exportScoped(button.dataset.datasetExport, button.dataset.exportFormat);
  });
})();

</script>
